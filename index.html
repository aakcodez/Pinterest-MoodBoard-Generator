<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Mood Board Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Pinterest Mood Board Generator</h1>
    </header>

    <main>

        <section id="search-section">
            <h2>Search Boards</h2>

            <label for="search-input">Search Board:</label>
            <input
                type="search"
                id="search-input"
                placeholder="Type to search...">
        </section>

        <section id="form-section">

            <h2>Add New Mood Board</h2>

            <form id="mood-board-form">

                <div>
                    <label for="image-upload">Upload Image:</label>
                    <input
                        type="file"
                        id="image-upload"
                        accept="image/*">
                </div>

                <div>
                    <label for="board-title">Title:</label>
                    <input
                        type="text"
                        id="board-title"
                        placeholder="Enter title">
                </div>

                <div>
                    <label for="board-caption">Caption:</label>
                    <textarea
                        id="board-caption"
                        placeholder="Write a longer caption here..."></textarea>
                </div>

                <button type="submit">
                    Add to Board
                </button>

            </form>

        </section>

        <section id="board-grid">

            <h2>Your Mood Boards</h2>

            <!-- Mood board cards will be generated dynamically using JavaScript -->

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
